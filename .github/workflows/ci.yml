name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q sentinel tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Import application
        env:
          SENTINEL_DB: ci-sentinel.db
          SENTINEL_ACTIVE_DISCOVERY: "0"
          SENTINEL_DNS_MONITORING: "0"
        run: python -c "import sentinel.app; print(sentinel.app.app.title, sentinel.app.VERSION)"
